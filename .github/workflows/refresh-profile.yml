name: Refresh profile feed

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/profile-feed/**'
      - 'go.mod'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-feed
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'CR1MS0N-Operator/CR1MS0N-Operator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate public-only snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/profile-feed -output "$RUNNER_TEMP/feed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-feed
          path: ${{ runner.temp }}/feed/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-feed
          path: ${{ runner.temp }}/feed
      - name: Publish generated files without changing main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          # Build a data-only tree; never check out or execute output-branch content.
          tree=$(
            for file in LATEST.md feed.json latest-dark.svg latest-light.svg; do
              blob=$(git hash-object -w "$RUNNER_TEMP/feed/$file")
              printf '100644 blob %s\t%s\n' "$blob" "$file"
            done | git mktree
          )
          parents=()
          if test -n "$(git ls-remote origin refs/heads/profile-feed)"; then
            git fetch --depth=1 origin refs/heads/profile-feed
            parent=$(git rev-parse FETCH_HEAD)
            if test "$tree" = "$(git rev-parse "$parent^{tree}")"; then
              echo 'Feed is unchanged.'
              exit 0
            fi
            parents=(-p "$parent")
          fi
          commit=$(git commit-tree "$tree" "${parents[@]}" -m 'chore(profile): refresh daily feed')
          git push origin "$commit:refs/heads/profile-feed"
